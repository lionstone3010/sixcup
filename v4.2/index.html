<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#f2f3f5"><meta name="description" content="SixCup: das Partyspiel mit 6 Bechern und einem Würfel, direkt im Handy-Browser."><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="SixCup"><meta name="application-name" content="SixCup"><meta name="apple-mobile-web-app-status-bar-style" content="default"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icons/apple-touch-icon.png"><link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png"><style>:root{box-sizing:border-box;padding-top:calc(env(safe-area-inset-top,0px) + var(--tx,0px));padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;padding:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<title>SixCup</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Manrope:wght@500;700;800&display=swap">
<style>
/* Layout: one column, full-bleed. Während des Spiels färbt sich der ganze Screen in der Farbe der Person, die dran ist. Start und Endstand auf hellem Papier. Bewusst ein eigenes Farbschema, unabhängig vom Systemmodus. */
:root{
  --paper:#f2f3f5;
  --ink:#14151b;
  --ink-soft:#5f6371;
  --drink:#ffc84a;
  --drink-deep:#f2960f;
  --foam:#fffaf0;
  --attack:#e23d28;
  --konter:#0e8a5c;
  --pc:#2b50e8;
  --bg:var(--paper);
  --fg:var(--ink);
  --soft:var(--ink-soft);
  --chip:#ffffff;
  --line:#dcdee4;
  --btn-bg:var(--ink);
  --btn-fg:#ffffff;
  --display:"Bricolage Grotesque","Arial Narrow",system-ui,sans-serif;
  --body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
body.color{
  --bg:var(--pc);
  --fg:#ffffff;
  --soft:rgba(255,255,255,.8);
  --chip:rgba(255,255,255,.16);
  --line:rgba(255,255,255,.34);
  --btn-bg:#ffffff;
  --btn-fg:var(--pc);
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.45;transition:background-color .5s ease;-webkit-tap-highlight-color:transparent}
.app{
  max-width:520px;margin:0 auto;box-sizing:border-box;min-height:100%;
  padding-left:max(18px, env(safe-area-inset-left, 0px));
  padding-right:max(18px, env(safe-area-inset-right, 0px));
  padding-block:18px 28px;
  display:flex;flex-direction:column;gap:22px;
}
h1,h2,h3{font-family:var(--display);font-weight:800;margin:0;letter-spacing:-.025em;text-wrap:balance;line-height:.95}
p{margin:0}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:3px solid currentColor;outline-offset:3px}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--soft)}
.soft{color:var(--soft)}

/* Buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:58px;padding:0 22px;border-radius:999px;box-sizing:border-box;
  background:var(--btn-bg);color:var(--btn-fg);font-weight:800;font-size:17px;transition:transform .1s ease, opacity .2s, background-color .5s, color .5s}
.btn:active{transform:scale(.97)}
.btn .sub{font-weight:600;opacity:.7}
.btn.alt{background:transparent;color:var(--fg);box-shadow:inset 0 0 0 2px var(--line)}
.btn[disabled]{opacity:.35;pointer-events:none}
.btn svg{width:20px;height:20px;stroke:currentColor}
.stack{display:flex;flex-direction:column;gap:10px}
.ib{width:44px;height:44px;border-radius:50%;background:var(--chip);display:grid;place-items:center;flex:none;transition:background-color .5s}
.ib svg{width:21px;height:21px;stroke:var(--fg)}
.ib[disabled]{opacity:.3;pointer-events:none}
.minis{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;width:100%}
.mini{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 14px;border-radius:999px;background:var(--chip);color:var(--fg);font-weight:800;font-size:14px;transition:transform .1s}
.mini:active{transform:scale(.95)}
.mini svg{width:18px;height:18px;stroke:currentColor}
.mini.card-btn{background:rgba(255,255,255,.92);color:var(--pc)}
.mini .dot{width:8px;height:8px;border-radius:50%;background:currentColor}

/* Glasses */
.table{display:grid;grid-template-columns:repeat(3,1fr);gap:6px 8px}
.g{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0;border-radius:16px;padding:2px 0;transition:background-color .2s,box-shadow .2s}
.g svg{width:68%;max-width:84px;height:auto;overflow:visible;display:block}
.g .shape{fill:rgba(255,255,255,.12);stroke:var(--fg);stroke-width:2.6;stroke-linejoin:round;transition:stroke .5s}
.g .deco{fill:none;stroke:var(--fg);stroke-width:2.6;stroke-linecap:round;transition:stroke .5s}
.g .base{fill:var(--fg);transition:fill .5s}
.g .liq{fill:var(--drink);transform-box:fill-box;transform-origin:50% 100%;transform:scaleY(0);transition:transform .7s cubic-bezier(.25,1.5,.45,1)}
.g .liq2{fill:var(--drink-deep);opacity:.5;transform-box:fill-box;transform-origin:50% 100%;transform:scaleY(0);transition:transform .75s cubic-bezier(.25,1.5,.45,1) .05s}
.g.t-shot .shape{stroke:#ffd23f;stroke-width:3.4}
.g .star{fill:#ffe68a;stroke:#b07800;stroke-width:1.4;stroke-linejoin:round}
.g .foam{fill:var(--foam);opacity:0;transition:opacity .3s .4s}
.g .shine{stroke:rgba(255,255,255,.55);stroke-width:2.6;stroke-linecap:round;fill:none}
.g.full .liq,.g.full .liq2{transform:scaleY(1)}
.g.full .foam{opacity:1}
.g .gn{font-family:var(--display);font-weight:800;font-size:22px;line-height:1;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;transition:background-color .2s,color .2s}
.g .gl{font-size:12px;font-weight:700;color:var(--soft);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.g.hit .gn{background:#fff;color:var(--pc)}
.g.hit-fill svg{animation:bob .7s ease}
.g.hit-drink svg{animation:shake .55s ease 2}
.g.tease .gn{background:rgba(255,255,255,.35)}
.g.tease svg{animation:shake .5s ease infinite}
.g.pickable{cursor:pointer;background:rgba(255,255,255,.12);box-shadow:inset 0 0 0 2px rgba(255,255,255,.5)}
.g.pickable:active{transform:scale(.96)}
.g.picked{background:rgba(255,255,255,.3);box-shadow:inset 0 0 0 3px #fff}
.g.dim{opacity:.35}
@keyframes bob{40%{transform:translateY(-8px) scale(1.06)}}
@keyframes shake{20%{transform:rotate(-9deg)}40%{transform:rotate(8deg)}60%{transform:rotate(-6deg)}80%{transform:rotate(4deg)}}

/* Intro */
.hero{display:flex;flex-direction:column;gap:12px;padding-top:18px}
.hero h1{font-size:clamp(56px,17vw,86px)}
.brand{background:radial-gradient(ellipse at 60% 40%,rgba(255,182,59,.16),transparent 62%),#08080b;border-radius:26px;display:flex;align-items:center;justify-content:center;padding:clamp(10px,3vw,18px) 0;margin-top:2px}
.brand .logo{display:block;width:min(74%,300px);height:auto;max-width:none}
.moved{display:flex;gap:10px;align-items:flex-start;background:var(--chip);border:1px solid var(--line);border-left:5px solid var(--drink);border-radius:16px;padding:12px 8px 12px 14px;font-size:14px;line-height:1.45;margin-top:6px}
.moved b{font-weight:800}.moved .ib{flex:none;margin:-6px 0 -6px auto}
.hero p{font-size:17px;color:var(--soft);max-width:30ch}
.lineup{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;padding:8px 0 4px}
.lineup .g .gn{font-size:16px;width:auto;height:auto}
.lineup .g svg{width:86%}
.section{display:flex;flex-direction:column;gap:2px}
.section>.eyebrow{margin-bottom:8px}
.setup{display:flex;flex-direction:column;gap:0}
.setup>.eyebrow{margin-bottom:6px}
.opt{display:grid;grid-template-columns:1fr auto;gap:4px 14px;align-items:center;padding:14px 0;border-top:1px solid var(--line)}
.opt .t{font-weight:800}
.opt .d{grid-column:1/-1;font-size:14px;color:var(--soft);margin-top:-2px}
.opt .d b{color:var(--fg)}
.opt .full{grid-column:1/-1}
.switch{width:52px;height:32px;border-radius:999px;background:#d5d8de;position:relative;transition:background-color .2s;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s cubic-bezier(.3,1.4,.5,1)}
.switch[aria-checked="true"]{background:var(--ink)}
.switch[aria-checked="true"]::after{transform:translateX(20px)}
.grow{display:grid;grid-template-columns:28px 1fr;gap:8px 12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.grow .num{font-family:var(--display);font-weight:800;font-size:22px}
.seg{display:flex;background:#e4e6eb;border-radius:999px;padding:3px}
.seg button{flex:1;min-height:36px;border-radius:999px;font-size:14px;font-weight:700;color:var(--ink-soft);transition:background-color .2s,color .2s;padding:0 6px}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff}
.field{width:100%;box-sizing:border-box;min-height:44px;padding:0 14px;border-radius:12px;border:1.5px solid var(--line);background:#fff;color:var(--ink)}
.field::placeholder{color:#9a9eaa}
.field:focus{outline:none;border-color:var(--ink)}
.grow .field{grid-column:2}
details.more{border-top:1px solid var(--line);padding-top:14px}
details.more summary{list-style:none;cursor:pointer;font-weight:800;display:flex;justify-content:space-between;align-items:center}
details.more summary::-webkit-details-marker{display:none}
details.more summary::after{content:"";width:10px;height:10px;border-right:2.5px solid currentColor;border-bottom:2.5px solid currentColor;transform:rotate(45deg) translateY(-3px);transition:transform .2s}
details.more[open] summary::after{transform:rotate(-135deg)}
.rules{margin:12px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:8px;color:var(--soft)}
.rules b{color:var(--fg)}
.cardlist{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.cardlist div{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:14px}
.cardlist .tag{grid-row:span 2;align-self:start;margin-top:2px}
.cardlist b{font-weight:800}
.cardlist span:last-child{color:var(--soft)}
.tag{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:999px;color:#fff}
.tag.attack{background:var(--attack)}
.tag.konter{background:var(--konter)}
.note{font-size:13px;color:var(--soft);text-align:center}
.startbar{position:sticky;bottom:calc(12px + env(safe-area-inset-bottom, 0px));z-index:3}
.startbar .btn{box-shadow:0 10px 30px rgba(20,21,27,.25)}

/* Avatars */
.av{position:relative;flex:none;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:800;color:#fff;background:var(--c);box-shadow:0 0 0 2.5px rgba(255,255,255,.9);overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.av-s{width:38px;height:38px;font-size:17px}
.av-m{width:50px;height:50px;font-size:22px}
.av-l{width:128px;height:128px;font-size:52px}
.av-xl{width:min(46vw,190px);height:min(46vw,190px);font-size:72px}
.koed .av{filter:grayscale(1)}
.stamp{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
.stamp span{font-family:var(--display);font-weight:800;color:#ff3b3b;border:3px solid #ff3b3b;border-radius:8px;padding:0 5px;transform:rotate(-18deg);background:rgba(255,255,255,.85);font-size:12px;line-height:1.3}
.stamp.big span{font-size:clamp(34px,10vw,54px);border-width:6px;border-radius:14px;padding:0 14px;animation:stampIn .45s cubic-bezier(.2,1.6,.4,1) both}
@keyframes stampIn{from{transform:rotate(-18deg) scale(1.7);opacity:0}}
.app.measuring .stamp{display:none}
.ko-av{position:relative;justify-content:center;margin:2px 0}
.app.game .ko-av .av{width:clamp(110px,21dvh,180px);height:clamp(110px,21dvh,180px);font-size:clamp(46px,9dvh,76px);border-width:4px}
.app.game .ko-av .stamp.big span{font-size:clamp(38px,6.6dvh,62px);border-width:clamp(4px,.7dvh,6px);background:#fff}
.app.game .verdict .ko-name{font-size:clamp(34px,6dvh,56px);line-height:1}
.app.game.tight .ko-av .av{width:clamp(96px,17dvh,140px);height:clamp(96px,17dvh,140px);font-size:clamp(40px,7dvh,58px)}
.app.game.tight .ko-av .stamp.big span{font-size:clamp(32px,5.4dvh,48px)}
.app.game.tighter .ko-av .av{width:88px;height:88px;font-size:38px}
.app.game.tighter .ko-av .stamp.big span{font-size:30px;border-width:4px;border-radius:10px;padding:0 8px}
.app.game.tighter .verdict .ko-name{font-size:30px}

/* Join */
.join-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.join-head h1{font-size:clamp(46px,14vw,64px);margin-top:6px}
.handoff{font-weight:700;font-size:15px;background:rgba(0,0,0,.16);border-radius:14px;padding:12px 14px}
.selfie{width:156px;height:156px;border-radius:50%;margin:0 auto;display:grid;place-items:center;overflow:hidden;border:2.5px dashed rgba(255,255,255,.7);color:#fff;font-weight:700;font-size:14px;transition:transform .15s}
.selfie:active{transform:scale(.96)}
.selfie img{width:100%;height:100%;object-fit:cover}
.selfie svg{width:40px;height:40px;stroke:#fff;display:block;margin:0 auto 6px}
.name-input{min-height:60px;border-radius:999px;border:0;background:#fff;color:var(--ink);font-size:22px;font-weight:800;text-align:center;font-family:var(--body)}
.name-input:focus{outline:3px solid rgba(255,255,255,.6);outline-offset:3px}
.seated{display:flex;flex-wrap:wrap;gap:12px 10px}
.seat{display:flex;flex-direction:column;align-items:center;gap:6px;width:56px}
.seat span{font-size:12px;font-weight:700;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* Peek (geheime Karte) */
.peek{align-items:center;text-align:center;justify-content:center}
.peek h1{font-size:clamp(34px,9vw,52px)}
.hold{width:min(66vw,250px);aspect-ratio:5/7;border-radius:24px;position:relative;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:none;cursor:pointer}
.hold .face{position:absolute;inset:0;border-radius:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:20px;box-sizing:border-box;backface-visibility:hidden;transition:transform .35s cubic-bezier(.3,1.2,.5,1)}
.hold .back{background:rgba(255,255,255,.14);box-shadow:inset 0 0 0 2.5px rgba(255,255,255,.6);color:#fff}
.hold .back .q{font-family:var(--display);font-weight:800;font-size:70px;line-height:1;opacity:.9}
.hold .back small{font-weight:700;font-size:14px;opacity:.85}
.hold .front{background:#fff;color:var(--ink);transform:rotateY(180deg)}
.hold.show .back{transform:rotateY(-180deg)}
.hold.show .front{transform:rotateY(0)}
.cardface .cn{font-family:var(--display);font-weight:800;font-size:clamp(28px,8vw,36px);line-height:1;letter-spacing:-.02em}
.cardface .ct{font-size:15px;font-weight:700;color:var(--ink-soft);line-height:1.35}
.cardface .none{font-family:var(--display);font-weight:800;font-size:26px;line-height:1.05}

/* Game */
.top{display:flex;align-items:center;gap:12px}
.top .who{flex:1;min-width:0}
.top .name{font-family:var(--display);font-weight:800;font-size:clamp(28px,8vw,36px);line-height:1;letter-spacing:-.02em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top .icons{display:flex;gap:6px}
.redirect{display:flex;align-items:center;gap:8px;align-self:center;background:rgba(0,0,0,.2);border-radius:999px;padding:4px 14px 4px 4px;font-weight:800;font-size:13px;max-width:100%}
.redirect .av{box-shadow:none}
.stage{display:flex;flex-direction:column;align-items:center;gap:16px;padding-top:4px}
.die{width:104px;height:104px;border-radius:28px;background:#fff;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:17px;box-sizing:border-box;gap:5px;box-shadow:0 10px 0 rgba(0,0,0,.16),0 18px 30px rgba(0,0,0,.18);flex:none}
.die .pip{border-radius:50%;margin:2px}
.die .pip.on{background:var(--pc);transition:background-color .5s}
.die.idle{cursor:pointer;animation:breathe 2.4s ease-in-out infinite}
.die.rolling{animation:tumble .7s cubic-bezier(.3,.7,.35,1)}
.die.teeter{animation:teeter .42s ease-in-out infinite}
.die.tip{animation:tip .3s ease-in both}
@keyframes breathe{50%{transform:translateY(-5px) rotate(-3deg)}}
@keyframes tumble{0%{transform:none}25%{transform:translateY(-44px) rotate(-150deg) scale(.86)}55%{transform:translateY(-8px) rotate(-290deg) scale(1.04)}75%{transform:translateY(-16px) rotate(-345deg)}100%{transform:rotate(-360deg)}}
@keyframes teeter{0%,100%{transform:rotate(-7deg) translateY(-2px)}50%{transform:rotate(9deg) translateY(-6px)}}
@keyframes tip{0%{transform:rotate(9deg)}100%{transform:rotate(95deg) translateY(-6px) scale(.9)}}
.verdict{text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px;min-height:84px;justify-content:center;max-width:100%}
.verdict .word{font-family:var(--display);font-weight:800;font-size:clamp(46px,14vw,66px);line-height:.9;letter-spacing:-.03em;animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
.verdict .line{font-weight:700;font-size:16px;color:var(--soft)}
.verdict .whobar{display:flex;align-items:center;gap:8px;font-weight:800;font-size:18px}
.after-k{background:var(--drink);color:#14151b;font-weight:800;font-size:13px;border-radius:999px;padding:4px 12px;animation:pop .45s cubic-bezier(.2,1.6,.4,1) .1s both}
.line.why b{font-weight:800}
.mdice{display:flex;gap:8px;justify-content:center;margin-top:4px}
.die.md,.app.game .die.md,.app.game.tight .die.md{display:grid;width:34px;height:34px;border-radius:9px;padding:6px;gap:1px;box-shadow:0 3px 0 rgba(0,0,0,.2)}
.die.md .pip{margin:1px}
.app.game.tighter .die.md{display:grid;width:26px;height:26px;padding:4px;border-radius:7px}
.streak{background:#fff;color:var(--pc);font-weight:800;font-size:13px;border-radius:999px;padding:4px 12px;animation:pop .45s cubic-bezier(.2,1.6,.4,1) .1s both}
@keyframes pop{from{transform:scale(.6);opacity:0}}
.actions{width:100%;display:flex;flex-direction:column;gap:10px}
.picks{display:grid;grid-template-columns:repeat(auto-fill,minmax(68px,1fr));gap:10px 6px;width:100%}
.pk{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.pk span{font-size:13px;font-weight:800;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pk:active .av{transform:scale(.94)}
.pk.off{opacity:.35;pointer-events:none}
.allrow{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding-bottom:8px}
.allrow .x{position:relative}
.allrow .x.saved .av{opacity:.35}
.allrow .x.saved::after{content:"gerettet";position:absolute;left:50%;bottom:-6px;transform:translateX(-50%);font-size:10px;font-weight:800;background:#fff;color:var(--konter);border-radius:999px;padding:0 5px}
.strip{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding:6px 2px 2px;margin:0 -2px}
.strip::-webkit-scrollbar{display:none}
.pl{flex:none;width:62px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.pl .av{box-shadow:0 0 0 2px rgba(255,255,255,.35)}
.pl.cur .av{box-shadow:0 0 0 3px #fff}
.pl .wrap{position:relative}
.pl .badge{position:absolute;right:-6px;bottom:-4px;min-width:22px;height:22px;padding:0 5px;box-sizing:border-box;border-radius:999px;background:#fff;color:var(--ink);font-weight:800;font-size:12px;display:grid;place-items:center;font-variant-numeric:tabular-nums}
.pl .cardic{position:absolute;left:-5px;top:-4px;width:14px;height:19px;border-radius:3px;background:#fff;box-shadow:0 0 0 1.5px var(--pc), 2px 2px 0 rgba(0,0,0,.2)}
.pl .cardic::after{content:"?";position:absolute;inset:0;display:grid;place-items:center;font-size:11px;font-weight:800;color:var(--pc)}

  ["doppel",   "Doppel",      "Du würfelst zweimal hintereinander dieselbe Zahl: Extra-Schluck für dich."],

const DEF_SETTINGS = () => ({ order:"circle", ko:false, hearts:3, cards:true, addons:{ full:true, doppel:false, drilling:true, rache:false, joker:true, duell:false }, rules:[] });
const RULE_TRIGS = { num:"Bei einer Zahl", shot:"Wenn jemand den goldenen Becher trinkt", streak3:"Bei 3 am Stück", full:"Bei Volles Haus", ko:"Wenn jemand K.O. ist", every10:"Alle 10 Würfe" };

  { trig:"num", n:3, text:"Alle stoßen an" },
  { trig:"shot", text:"Wer den goldenen Becher trinkt, sucht das nächste Lied aus" },
  { trig:"every10", text:"Wasser-Runde: alle einmal Wasser" },

const LS = {

  set(k,v){ try { localStorage.setItem(k,v); return true; } catch(e){ return false; } },
  del(k){ try { localStorage.removeItem(k); } catch(e){} }
};
/* Foto-Hinweis: jede Person sieht ihn einmal, beim ersten Trinken (gemerkt pro Spieler, unabhängig von Rückgängig) */
function camTips(){ try { return JSON.parse(LS.get("tw_camtips") || "[]"); } catch(e){ return []; } }
const camTipSeen = id => camTips().includes(id);
function markCamTip(id){ if (!id) return; const a = camTips().filter(x => x !== id); a.push(id); LS.set("tw_camtips", JSON.stringify(a.slice(-80))); }
/* Fairer Würfel: echte Zufallszahl, keine Gewichtung */
function rndInt(n){
  if (n <= 1) return 0;
  try {
    const lim = Math.floor(4294967296 / n) * n; const a = new Uint32Array(1);
    do { crypto.getRandomValues(a); } while (a[0] >= lim);
    return a[0] % n;
  } catch(e){ return Math.floor(Math.random() * n); }
}
const rnd6 = () => rndInt(6) + 1;
function shuffle(a){ for (let i = a.length - 1; i > 0; i--){ const j = rndInt(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function buzz(p){ try { navigator.vibrate && navigator.vibrate(p); } catch(e){} }
const reduced = (() => { try { return matchMedia("(prefers-reduced-motion: reduce)").matches; } catch(e){ return false; } })();
const inSandbox = (() => { try { return window.self !== window.top || !!window.claude; } catch(e){ return true; } })();

const ICON = {
  board: svgI('<path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0V4z"/><path d="M17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/>'),
  undo:  svgI('<path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/>'),
  menu:  svgI('<path d="M4 7h16M4 12h16M4 17h10"/>'),
  close: svgI('<path d="M6 6l12 12M18 6 6 18"/>'),
  cam:   svgI('<path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/>'),
  down:  svgI('<path d="M12 4v11M7 10l5 5 5-5M5 20h14"/>'),
  card:  svgI('<rect x="6" y="3" width="12" height="18" rx="2"/><path d="M10 9h4M10 13h4"/>'),
  shield:svgI('<path d="M12 3l7 3v6c0 4-3 7-7 9-4-2-7-5-7-9V6z"/>'),
  soundOn: svgI('<path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16 9a4 4 0 0 1 0 6M18.5 6.5a7.5 7.5 0 0 1 0 11"/>'),
  soundOff:svgI('<path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 9.5l5 5M21.5 9.5l-5 5"/>'),
  share: svgI('<path d="M12 3v13M7 8l5-5 5 5"/><path d="M5 13v7h14v-7"/>'),
  plus:  svgI('<path d="M12 5v14M5 12h14"/>'),
  swap:  svgI('<path d="M7 7h12l-3-3M17 17H5l3 3"/>')
};

/* =====================================================================
   Besucherzähler (GoatCounter): nur auf der eigenen Webseite, ohne Cookies.
   Gezählt werden nur Aufrufe und Spielstarts, keine Namen, Fotos oder Spielstände.
   ===================================================================== */
const COUNTER = "https://trinkwuerfel.goatcounter.com/count";
/* Zähler nur auf der Hauptadresse /sixcup/ (nie in Archiv-Ordnern wie /sixcup/v3.1/), immer als "/sixcup" gezählt */
const counting = false; /* Archiv: zählt nicht mit */
if (counting){
  try {
    window.goatcounter = Object.assign(window.goatcounter || {}, { path:"/sixcup" });
    const sc = document.createElement("script");
    sc.async = true; sc.src = "https://gc.zgo.at/count.js"; sc.dataset.goatcounter = COUNTER;
    document.head.appendChild(sc);
  } catch(e){}
}
function countEvent(path, title){
  if (!counting) return;
  try { if (window.goatcounter && window.goatcounter.count) window.goatcounter.count({ path, title, event:true }); } catch(e){}
}

/* =====================================================================
   Zustand
   ===================================================================== */
const defaultGlasses = () => [0,1,2,3,4,5].map(i => ({ type: i === 5 ? "shot" : "glas", content:"" }));
function loadPrefs(){
  try {
    const raw = JSON.parse(LS.get("tw_prefs") || "null");
    if (raw && raw.settings){
      const d = DEF_SETTINGS();
      const s = Object.assign(d, raw.settings); s.addons = Object.assign(DEF_SETTINGS().addons, raw.settings.addons || {});
      if (!ORDERS[s.order]) s.order = "circle";
      if (![3,4,5].includes(s.hearts)) s.hearts = 3;
      s.rules = Array.isArray(raw.settings.rules) ? raw.settings.rules.filter(r => r && RULE_TRIGS[r.trig] && r.text).slice(0, 8) : [];
      return { settings:s, config: Array.isArray(raw.config) && raw.config.length === 6 ? fixCups(raw.config) : defaultGlasses() };
    }
  } catch(e){}
  return { settings:DEF_SETTINGS(), config:defaultGlasses() };
}
function fresh(){
  const pr = loadPrefs();
  return { v:3, phase:"intro", joining:false, settings:pr.settings, config:pr.config,
    players:[], glasses:JSON.parse(JSON.stringify(pr.config)), full:[false,false,false,false,false,false],
    turn:0, steps:[], after:null, redirect:null, rolls:[], chain:null, rollId:0, eventId:0, lastRoll:5, lastFill:null,
    history:[], proofs:[], handedFrom:null, bag:[], deck:[], peekQueue:[], peekReturn:"game",
    rage:null, winners:null, spin:null, recapPending:false, gameId:uid(), started:Date.now() };
}

let photos = {};
let undoStack = [];
let draft = { name:"", photo:null };
let rolling = false;
const fxQ = [];
let storageWarned = false;

function save(){ LS.set("tw_state", JSON.stringify(state)); }
function savePrefs(){ LS.set("tw_prefs", JSON.stringify({ settings:state.settings, config:state.config })); }
function savePhoto(id, data){
  photos[id] = data;
  idbPut("photos", id, data).then(ok => {
    if (ok) return;
    if (!LS.set("tw_ph_" + id, data) && !storageWarned){ storageWarned = true; toast("Handyspeicher voll: neue Fotos bleiben nur bis zum Neuladen."); }
  });
}
function dropPhoto(id){ if (!id) return; delete photos[id]; LS.del("tw_ph_" + id); idbDel("photos", id); }
function photoIds(){
  const ids = state.players.map(p => p.photo).filter(Boolean);
  state.proofs.forEach(x => { ids.push(x.photo); (x.frames || []).forEach(f => ids.push(f)); });
  return ids;
}
async function loadPhotos(list){
  const ids = (list || photoIds()).filter(id => id && !photos[id]); let got = false;
  for (const id of ids){ let d = LS.get("tw_ph_" + id); if (!d) d = await idbGet("photos", id); if (d){ photos[id] = d; got = true; } }
  return got;
}
function pushUndo(){ undoStack.push(JSON.stringify(state)); if (undoStack.length > 50) undoStack.shift(); }
const emit = fx => { if (fx.type === "sound"){ sfx(fx.name); return; } fxQ.push(fx); };

const P = id => state.players.find(p => p.id === id);
const cur = () => state.players[state.turn];
const active = () => state.players.filter(p => p.active);
const tot = p => p.drinks + p.shots + p.extras;   // goldener Becher zählt doppelt
const colorOf = p => PALETTE[(p ? p.color : 0) % PALETTE.length];
const others = id => active().filter(p => p.id !== id);
function nextIndex(from){
  const n = state.players.length;
  for (let k = 1; k <= n; k++){ const i = (from + k) % n; if (state.players[i].active) return i; }
  return -1;
}
const nobodyAfter = i => !state.players.slice(i + 1).some(p => p.active);
const glassLabel = i => { const g = state.glasses[i]; return TYPE_LONG[g.type] + (g.content ? " · " + g.content : ""); };
function log(e){ state.history.push(Object.assign({ t:Date.now() }, e)); if (state.history.length > 400) state.history.shift(); }
function rage(score, pid, text){ if (!state.rage || score >= state.rage.score) state.rage = { score, pid, text, t:Date.now() }; }

/* =====================================================================
   SPIEL-ENGINE (ohne DOM)
   ===================================================================== */
function dealCard(){
  if (!state.settings.cards) return null;
  if (rndInt(3) === 0) return null;          // etwa ein Drittel ohne Karte
  if (!state.deck.length) state.deck = shuffle(Object.keys(CARDS));
  return state.deck.pop();
}
function makePlayer(name, photoId){
  const used = new Set(state.players.map(p => p.color));
  let color = state.players.length; for (let c = 0; c < PALETTE.length; c++) if (!used.has(c)){ color = c; break; }
  return { id:uid(), name:String(name).trim().slice(0,18), photo:photoId || null, color, active:true, ko:false, koAt:0,
    hearts:state.settings.hearts, drinks:0, shots:0, extras:0, streak:0, best:0,
    card:dealCard(), cardUsed:false, jokerUsed:false, konters:0, drillings:0, nearLast:0, nearRefill:0 };
}

function eStartJoin(){
  const keepPrefs = { settings:state.settings, config:state.config };
  state = fresh(); state.settings = keepPrefs.settings; state.config = keepPrefs.config;
  state.glasses = JSON.parse(JSON.stringify(state.config));
  state.phase = "join"; state.joining = true; undoStack = [];
}
function eJoin(name, photoId){
  if (!String(name || "").trim()) return null;
  pushUndo();
  const p = makePlayer(name, photoId);
  state.players.push(p); state.turn = state.players.length - 1;
  state.handedFrom = null; state.steps = []; state.after = null;
  if (state.settings.cards){ state.peekQueue = [p.id]; state.peekReturn = "game"; state.phase = "peek"; }
  else state.phase = "game";
  return p;
}
function ePeekDone(){
  state.peekQueue.shift();
  if (!state.peekQueue.length) state.phase = state.peekReturn || "game";
}
function eAllIn(){
  if (state.players.length < 2 || state.phase !== "join") return false;
  pushUndo();
  state.joining = false; state.phase = "game"; state.handedFrom = null; state.steps = []; state.after = null; state.bag = [];
  if (state.settings.order === "circle"){ const fi = state.players.findIndex(p => p.active); state.turn = fi < 0 ? 0 : fi; }
  else { const ni = pickRandom(null); if (ni >= 0){ state.turn = ni; state.spin = { id:state.players[ni].id, slow:false }; } }
  finish();
  return true;
}
function pickRandom(prevId){
  const alive = active(); if (!alive.length) return -1;
  let id;
  if (state.settings.order === "chaos") id = alive[rndInt(alive.length)].id;
  else {
    state.bag = state.bag.filter(x => { const q = P(x); return q && q.active; });
    if (!state.bag.length) state.bag = alive.map(q => q.id);
    let cand = state.bag.filter(x => x !== prevId); if (!cand.length) cand = state.bag.slice();
    id = cand[rndInt(cand.length)];
    state.bag.splice(state.bag.indexOf(id), 1);
  }
  return state.players.findIndex(q => q.id === id);
}
function nextTurn(){
  const p = cur(); state.handedFrom = p ? p.id : null;
  if (state.joining && nobodyAfter(state.turn)){ state.phase = "join"; return; }
  const ord = state.joining ? "circle" : state.settings.order;
  const ni = ord === "circle" ? nextIndex(state.turn) : pickRandom(p ? p.id : null);
  if (ni >= 0){
    state.turn = ni;
    if (ord !== "circle") state.spin = { id:state.players[ni].id, slow: state.full.filter(Boolean).length >= 5 };
  }
}
function decideWinner(){
  const alive = active(); let w;
  if (alive.length === 1) w = [alive[0].id];
  else {
    const last = Math.max(0, ...state.players.map(p => p.koAt || 0));
    const c = state.players.filter(p => (p.koAt || 0) === last);
    const min = Math.min(...c.map(tot));
    w = c.filter(p => tot(p) === min).map(p => p.id);
  }
  state.winners = w; eEnd();
}
function prune(){
  // Auswahl ohne mögliches Ziel (z. B. alle anderen ausgestiegen) überspringen
  while (state.steps[0] && state.steps[0].t === "pick" && state.steps[0].purpose !== "sabotage" && state.steps[0].purpose !== "tausch" && !pickTargets(state.steps[0]).length){
    const s = state.steps.shift();
    if (s.purpose === "joker"){ const by = P(s.by); if (by) by.jokerUsed = false; }
  }
  if (state.steps[0] && state.steps[0].t === "pick" && state.steps[0].purpose === "sabotage" && !state.full.some(f => !f)) state.steps.shift();
}
function finish(){
  prune();
  if (state.steps.length || state.phase !== "game") return;
  if (state.settings.ko && !state.joining && state.players.length >= 2 && active().length <= 1){ decideWinner(); return; }
  if (!active().length){ if (!state.joining) eEnd(); else state.phase = "join"; return; }
  const p = cur();
  if (state.after === "again" && p && p.active){ state.after = null; return; }
  if (state.after === "pass" || !p || !p.active){ state.after = null; if (p) p.streak = 0; nextTurn(); }
}
function knockOut(p, cause){
  p.ko = true; p.active = false; p.koAt = state.eventId; p.streak = 0; p.hearts = 0;
  log({ kind:"ko", pid:p.id, via:cause }); emit({ type:"sound", name:"ko" }); houseRule("ko");
  if (cause === "doppel" || cause === "drilling") rage(6, p.id, `${p.name}. Raus durch ${cause === "doppel" ? "ein Doppel" : "einen Drilling"}. Mit dem letzten Herz.`);
  if (state.redirect && (state.redirect.target === p.id)) state.redirect = null;
  state.bag = state.bag.filter(id => id !== p.id);
  state.steps = state.steps.filter(s => !(s.t === "drink" && s.who === p.id) && !(s.t === "pick" && s.by === p.id && s.purpose !== "duell"));
  if (cur() && cur().id === p.id) state.after = "pass";
  return [{ t:"ko", who:p.id, voluntary: cause === "leave" }];
}
function hurt(p, n, cause){
  if (!state.settings.ko || p.ko) return [];
  p.hearts = Math.max(0, p.hearts - n);
  return p.hearts > 0 ? [] : knockOut(p, cause);
}
function houseRule(trig, n){
  (state.settings.rules || []).filter(r => r.trig === trig && (trig !== "num" || r.n === n)).forEach(r => {
    emit({ type:"rule", text:r.text, label:ruleLabel(r) }); log({ kind:"rule", text:r.text });
  });
}
function checkFullHouse(){
  if (!state.settings.addons.full || !state.full.every(Boolean)) return;
  state.steps.unshift({ t:"allDrink", excused:[], key:uid() });
  emit({ type:"fullhouse" }); log({ kind:"fullhouse" }); houseRule("full");
}
function setFill(i, pid, sabotage){
  state.full[i] = true;
  state.lastFill = { glass:i, pid, rollId:state.rollId, t:Date.now(), sabotage:!!sabotage };
}

function eRoll(n){
  if (state.phase !== "game" || state.steps.length || !cur() || !cur().active) return false;
  n = Math.max(1, Math.min(6, n | 0));
  pushUndo();
  const p = cur(); const i = n - 1;
  state.rollId++; state.lastRoll = n;
  state.rolls.push(n); if (state.rolls.length > 12) state.rolls.shift();
  const fullCount = state.full.filter(Boolean).length;
  log({ kind:"roll", pid:p.id, roll:n });
  if (state.full[i]){
    if (fullCount === 1){ p.nearLast++; rage(2, p.id, `${p.name}. Becher ${n}. Der einzige volle Becher auf dem Tisch.`); }
    const lf = state.lastFill;
    if (lf && lf.glass === i && lf.rollId === state.rollId - 1 && lf.pid !== p.id){
      p.nearRefill++;
      const f = P(lf.pid); const sec = Math.max(1, Math.round((Date.now() - lf.t) / 1000));
      rage(lf.sabotage ? 4 : 3, p.id, `${p.name}. Becher ${n}. ${sec} Sekunden, nachdem ${f ? f.name : "jemand"} ihn ${lf.sabotage ? "sabotiert" : "gefüllt"} hat.`);
    }
    let who = p.id, from = null, via = null;
    const r = state.redirect;
    if (r){ const t = P(r.target); if (t && t.active){ who = t.id; from = r.from; via = r.src; } state.redirect = null; }
    state.steps.push({ t:"drink", who, from, via, glass:i, main:true, key:uid() });
    state.after = "again";
  } else {
    state.steps.push({ t:"fill", glass:i, main:true });
    state.after = "pass";
  }
  houseRule("num", n); if (state.rollId % 10 === 0) houseRule("every10");
  /* Doppel: dieselbe Person würfelt zweimal hintereinander dieselbe Zahl.
     Drilling: direkt nach einem Doppel würfelt die nächste Person (oder dieselbe) diese Zahl auch. Danach beginnt die Zählung neu. */
  const A = state.settings.addons, ch = state.chain;
  if (ch && ch.n === n && ch.stage === 2){
    state.chain = null;
    if (A.drilling){
      const by = P(ch.pid); const same = by && by.id === p.id;
      const sub = same ? `Dreimal die ${n} von ${p.name}. Extra-Schluck für ${p.name}.` : `${by ? by.name : "Jemand"} hatte die ${n} doppelt, jetzt ${p.name} auch. Extra-Schluck für ${p.name}.`;
      p.drillings++; state.steps.push({ t:"drink", who:p.id, kurz:true, via:"drilling", n, by:ch.pid, key:uid() });
      emit({ type:"banner", text:"Drilling!", sub, ms:2600 }); log({ kind:"drilling", pid:p.id, roll:n });
    }
  } else if (ch && ch.n === n && ch.stage === 1 && ch.pid === p.id){
    state.chain = { n, pid:p.id, stage:2 };
    if (A.doppel){
      state.steps.push({ t:"drink", who:p.id, kurz:true, via:"doppel", n, key:uid() });
      emit({ type:"banner", text:"Doppel!", sub:`${p.name} hat zweimal die ${n}. Extra-Schluck für ${p.name}.`, ms:2600 }); log({ kind:"doppel", pid:p.id, roll:n });
    }
  } else state.chain = { n, pid:p.id, stage:1 };
  return true;
}

function eConfirm(){
  const s = state.steps[0]; if (!s || s.t === "pick") return false;
  pushUndo(); state.eventId++;
  const p = cur();
  if (s.t === "fill"){
    setFill(s.glass, p.id, false); p.streak = 0;
    log({ kind:"fill", pid:p.id, roll:s.glass + 1 });
    state.steps.shift();
    checkFullHouse();
  } else if (s.t === "drink"){
    const d = P(s.who); state.steps.shift();
    const front = [];
    if (d){
      if (s.kurz){
        d.extras++;
        log({ kind:"kurz", pid:d.id, via:s.via, from:s.from });
        front.push(...hurt(d, 1, s.via));
      } else {
        const g = state.glasses[s.glass]; state.full[s.glass] = false;
        d.drinks++; if (g.type === "shot") d.shots++;
        log({ kind:"drink", pid:d.id, roll:s.glass + 1, label:glassLabel(s.glass), via:s.via, from:s.from });
        const own = p && d.id === p.id && !s.from;
        if (own){
          p.streak++; p.best = Math.max(p.best, p.streak);
          if (p.streak >= 4) rage(2 + p.streak, p.id, `${p.name}. ${p.streak} Becher am Stück.`);
          if (p.streak >= 3) emit({ type:"serie", pid:p.id, n:p.streak });
          if (p.streak === 3) houseRule("streak3");
        }
        front.push(...hurt(d, g.type === "shot" ? 2 : 1, "glass"));
        if (g.type === "shot") houseRule("shot");
        if (g.type === "shot" && state.settings.addons.duell && others(d.id).length) front.push({ t:"pick", purpose:"duell", by:d.id });
        if (own && state.settings.addons.rache && p.active && p.streak > 0 && p.streak % 3 === 0 && others(p.id).length) front.push({ t:"pick", purpose:"rache", by:p.id });
      }
    }
    state.steps.unshift(...front);
  } else if (s.t === "allDrink"){
    state.steps.shift(); const front = [];
    active().forEach(q => { if (!s.excused.includes(q.id)){ q.extras++; front.push(...hurt(q, 1, "full")); } });
    log({ kind:"allDrink", excused:s.excused.slice() });
    state.steps.unshift(...front);
  } else {
    state.steps.shift();
  }
  finish();
  return true;
}

function canJoker(){
  const s = state.steps[0]; const p = cur();
  return !!(s && s.t === "drink" && s.main && p && s.who === p.id && !s.from && state.settings.addons.joker && !p.jokerUsed && others(p.id).length);
}
function eJoker(){
  if (!canJoker()) return false;
  pushUndo(); const p = cur(); p.jokerUsed = true;
  state.steps.unshift({ t:"pick", purpose:"joker", by:p.id });
  return true;
}

function ePlayCard(){
  const p = cur(); if (!p || state.phase !== "game") return "ctx";
  const s = state.steps[0];
  const ctx = !s || (s.t === "fill" && s.main) || s.t === "pass";
  if (!ctx) return "ctx";
  if (!state.settings.cards || !p.card || p.cardUsed) return "none";
  if (CARDS[p.card].kind !== "attack") return "mismatch";
  const fillIdx = s && s.t === "fill" ? s.glass : -1;
  if (p.card === "sabotage" && !state.full.some((f, i) => !f && i !== fillIdx)) return "mismatch";
  if ((p.card === "umleitung" || p.card === "barkeeper") && !others(p.id).length) return "mismatch";
  pushUndo();
  if (s && s.t === "fill"){
    setFill(s.glass, p.id, false); p.streak = 0;
    log({ kind:"fill", pid:p.id, roll:s.glass + 1 });
    state.steps.shift(); state.steps.push({ t:"pass" });
  }
  p.cardUsed = true;
  log({ kind:"card", pid:p.id, card:p.card });
  emit({ type:"card", pid:p.id, card:p.card });
  state.steps.unshift({ t:"pick", purpose:p.card, by:p.id });
  if (fillIdx >= 0) checkFullHouse();
  return "ok";
}

function pickTargets(s){
  if (!s || s.t !== "pick") return [];
  if (s.purpose === "engel"){ const a = state.steps[1]; return others(s.by).filter(q => !(a && a.excused && a.excused.includes(q.id))); }
  return others(s.by);
}
function ePickPlayer(tid){
  const s = state.steps[0]; if (!s || s.t !== "pick" || s.purpose === "sabotage" || s.purpose === "tausch") return false;
  if (!pickTargets(s).some(q => q.id === tid)) return false;
  pushUndo(); state.steps.shift();
  const by = P(s.by), t = P(tid);
  switch (s.purpose){
    case "duell": case "barkeeper":
      state.steps.unshift({ t:"drink", who:tid, from:s.by, via:s.purpose, kurz:true, key:uid() });
      log({ kind:"target", pid:s.by, target:tid, via:s.purpose });
      break;
    case "rache": case "umleitung":
      state.redirect = { target:tid, from:s.by, src:s.purpose };
      log({ kind:"target", pid:s.by, target:tid, via:s.purpose });
      emit({ type:"banner", text: s.purpose === "rache" ? "Rache!" : "Umleitung!", sub:`Den nächsten vollen Becher trinkt ${t.name}.` });
      break;
    case "joker": {
      const d = state.steps[0];
      if (d && d.t === "drink"){ d.who = tid; d.from = s.by; d.via = "joker"; }
      log({ kind:"target", pid:s.by, target:tid, via:"joker" });
      emit({ type:"banner", text:"Joker!", sub:`${by.name} gibt den Becher an ${t.name}.` });
      break;
    }
    case "engel": {
      const d = state.steps[0];
      if (d && d.t === "allDrink") d.excused.push(tid);
      log({ kind:"saved", pid:s.by, target:tid });
      break;
    }
  }
  finish();
  return true;
}
function ePickGlass(i){
  const s = state.steps[0]; if (!s || s.t !== "pick") return false;
  if (s.purpose === "sabotage"){
    if (state.full[i]) return false;
    pushUndo(); setFill(i, s.by, true);
    log({ kind:"sabotage", pid:s.by, roll:i + 1 });
    state.steps.shift(); checkFullHouse(); finish();
    return true;
  }
  if (s.purpose === "tausch"){
    if (s.first == null || s.first === i){ s.first = s.first === i ? null : i; return true; }
    pushUndo();
    const a = s.first, b = i;
    [state.glasses[a], state.glasses[b]] = [state.glasses[b], state.glasses[a]];
    [state.full[a], state.full[b]] = [state.full[b], state.full[a]];
    if (state.lastFill){ if (state.lastFill.glass === a) state.lastFill.glass = b; else if (state.lastFill.glass === b) state.lastFill.glass = a; }
    log({ kind:"tausch", pid:s.by, a:a + 1, b:b + 1 });
    state.steps.shift(); finish();
    return true;
  }
  return false;
}

function eKonter(pid){
  const s = state.steps[0]; if (!s || (s.t !== "drink" && s.t !== "allDrink")) return "ctx";
  const p = P(pid); if (!p || !p.active) return "none";
  if (!state.settings.cards || !p.card || p.cardUsed) return "none";
  const c = p.card; let ok = false;
  if (c === "glueckspilz") ok = s.t === "drink" ? s.who === pid : !s.excused.includes(pid);
  else if (c === "spiegel") ok = s.t === "drink" && s.who === pid && !!s.from && s.from !== pid && !!P(s.from) && P(s.from).active;
  else if (c === "schutzengel") ok = s.t === "drink" ? s.who !== pid : active().some(q => q.id !== pid && !s.excused.includes(q.id));
  if (!ok) return "mismatch";
  pushUndo(); p.cardUsed = true; p.konters++;
  const target = s.t === "drink" ? (c === "spiegel" ? s.from : s.who) : null;
  log({ kind:"konter", pid, card:c, target });
  emit({ type:"card", pid, card:c, target });
  if (c === "spiegel"){
    const att = P(s.from);
    rage(4, att.id, `${att.name}. Vom eigenen ${VIA[s.via] || "Angriff"} getroffen. Spiegel von ${p.name}.`);
    s.who = s.from; s.from = pid; s.via = "spiegel";
  } else if (s.t === "allDrink"){
    if (c === "glueckspilz") s.excused.push(pid);
    else state.steps.unshift({ t:"pick", purpose:"engel", by:pid });
  } else {
    state.steps.shift();
    if (s.main) state.after = "pass";
    finish();
  }
  return "ok";
}

function eLeave(id){
  const idx = state.players.findIndex(p => p.id === id); const p = state.players[idx];
  if (!p || !p.active) return false;
  pushUndo(); state.eventId++;
  let front = [];
  if (state.settings.ko) front = knockOut(p, "leave");
  else {
    p.active = false; p.streak = 0; log({ kind:"leave", pid:id });
    if (state.redirect && state.redirect.target === id) state.redirect = null;
    state.bag = state.bag.filter(x => x !== id);
    state.steps = state.steps.filter(s => !(s.t === "drink" && s.who === id) && !(s.t === "pick" && s.by === id));
  }
  if (idx === state.turn){ state.steps = []; state.after = "pass"; }
  if (state.phase === "game"){ state.steps.unshift(...front); finish(); }
  if (state.phase === "game" && !active().length && !state.joining) eEnd();
  return true;
}
function eRejoin(id){
  const p = P(id); if (!p || p.active || p.ko) return false;
  pushUndo(); p.active = true; log({ kind:"rejoin", pid:id });
  if (!cur() || !cur().active) state.turn = state.players.indexOf(p);
  return true;
}
function eAdd(name, photoId){
  if (!String(name || "").trim()) return null;
  pushUndo();
  const p = makePlayer(name, photoId);
  state.players.splice(state.turn + 1, 0, p);
  log({ kind:"add", pid:p.id });
  if (state.settings.cards && state.phase === "game"){ state.peekQueue = [p.id]; state.peekReturn = "game"; state.phase = "peek"; }
  return p;
}
function eEnd(){ state.phase = "end"; state.steps = []; state.after = null; state.joining = false; state.redirect = null; state.recapPending = true; if (state.winners) emit({ type:"sound", name:"win" }); }
function eRematch(){
  state.players.forEach(p => Object.assign(p, { active:true, ko:false, koAt:0, hearts:state.settings.hearts, drinks:0, shots:0, extras:0, streak:0, best:0,
    card:null, cardUsed:false, jokerUsed:false, konters:0, drillings:0, nearLast:0, nearRefill:0 }));
  state.deck = []; state.players.forEach(p => { p.card = dealCard(); });
  Object.assign(state, { glasses:JSON.parse(JSON.stringify(state.config)), full:[false,false,false,false,false,false], steps:[], after:null, redirect:null,
    rolls:[], chain:null, history:[], proofs:[], rage:null, winners:null, lastFill:null, bag:[], joining:false, recapPending:false, handedFrom:null,
    gameId:uid(), started:Date.now(), rollId:0 });
  undoStack = [];
  if (state.settings.order === "circle") state.turn = 0;
  else { const ni = pickRandom(null); state.turn = ni < 0 ? 0 : ni; state.spin = { id:state.players[state.turn].id, slow:false }; }
  if (state.settings.cards){ state.peekQueue = state.players.map(p => p.id); state.peekReturn = "game"; state.phase = "peek"; }
  else state.phase = "game";
}

/* =====================================================================
   OBERFLÄCHE
   ===================================================================== */
const app = document.getElementById("app");
const sheetRoot = document.getElementById("sheet-root");
const fxRoot = document.getElementById("fx-root");
let headless = false;

function act(fn){
  const r = fn();
  save();
  if (!headless){ render(); pumpFx(); }
  return r;
}
function toast(t){
  if (headless) return;
  const root = document.getElementById("toast-root");
  root.innerHTML = `<div class="toast" role="status">${esc(t)}</div>`;

/* ---- Fotos ---- */
function pickPhoto(front, opts){
  return new Promise(resolve => {
    const inp = document.createElement("input");
    inp.type = "file"; inp.accept = "image/*";
    inp.setAttribute("capture", front ? "user" : "environment");
    inp.style.cssText = "position:fixed;left:-9999px";
    document.body.appendChild(inp);
    inp.addEventListener("change", () => {
      const f = inp.files && inp.files[0]; inp.remove();
      if (!f) return resolve(null);
      const url = URL.createObjectURL(f); const img = new Image();
      img.onload = () => { const d = shrink(img, opts); URL.revokeObjectURL(url); resolve(d); };
      img.onerror = () => { URL.revokeObjectURL(url); resolve(null); };
      img.src = url;
    }, { once:true });
    inp.click();
  });
}
function shrink(src, opts){
  try {
    const w0 = src.videoWidth || src.naturalWidth, h0 = src.videoHeight || src.naturalHeight;
    const c = document.createElement("canvas"); const ctx = c.getContext("2d");
    if (opts.square){
      const s = Math.min(w0, h0); c.width = c.height = opts.max;
      ctx.drawImage(src, (w0 - s) / 2, (h0 - s) / 2, s, s, 0, 0, opts.max, opts.max);
    } else {
      const sc = Math.min(1, opts.max / Math.max(w0, h0));
      c.width = Math.round(w0 * sc); c.height = Math.round(h0 * sc);
      ctx.drawImage(src, 0, 0, c.width, c.height);
    }
    return c.toDataURL("image/jpeg", opts.q || 0.74);
  } catch(e){ return null; }
}
function avatar(p, size){
  const ph = p && p.photo && photos[p.photo];
  const ini = esc(((p && p.name) || "?").trim().charAt(0).toUpperCase());
  return `<span class="av av-${size}" style="--c:${colorOf(p)}">${ph ? `<img src="${ph}" alt="">` : ini}</span>`;
}
function proofImg(x, extra){
  const frames = (x.frames || []).filter(f => photos[f]);
  if (frames.length > 1) return `<img src="${photos[frames[0]]}" data-boom="${frames.join(",")}" alt="" ${extra||""}>`;
  return photos[x.photo] ? `<img src="${photos[x.photo]}" alt="" ${extra||""}>` : "";
}
/* Boomerang-Animation: alle Bilder mit data-boom laufen 1-2-3-4-3-2 */
const BOOM = [0,1,2,3,2,1]; let boomTick = 0;
setInterval(() => {
  const els = document.querySelectorAll("img[data-boom]"); if (!els.length) return;
  boomTick++;
  els.forEach(el => { const f = el.dataset.boom.split(","); const seq = BOOM.filter(k => k < f.length); const id = f[seq[boomTick % seq.length]]; if (photos[id] && el.getAttribute("src") !== photos[id]) el.src = photos[id]; });
}, 120);

/* Eintragen: bei wenig Platz schrittweise verkleinern, notfalls scrollen statt abschneiden */
function fitJoin(){
  app.classList.remove("jt", "jt2", "jscroll");
  const over = () => app.scrollHeight > app.clientHeight + 1;
  if (over()){ app.classList.add("jt"); if (over()){ app.classList.add("jt2"); if (over()) app.classList.add("jscroll"); } }
}
/* Prüft, ob der Inhalt in der Mitte Platz hat, und verkleinert sonst schrittweise */
function fitStage(){
  const st = app.querySelector(".stage"); if (!st) return;
  app.classList.remove("tight", "tighter", "tightest");
  app.classList.add("measuring");
  const over = () => {
    const kids = [...st.children];
    const cs = getComputedStyle(st);
    const avail = st.clientHeight - parseFloat(cs.paddingTop || 0) - parseFloat(cs.paddingBottom || 0);
    const need = kids.reduce((s, c) => s + (parseFloat(getComputedStyle(c).height) || c.offsetHeight), 0) + Math.max(0, kids.length - 1) * parseFloat(cs.rowGap || 0);
    return need > avail - 2 || kids.some(c => c.scrollHeight > c.offsetHeight + 1);
  };
  if (over()){ app.classList.add("tight"); if (over()){ app.classList.add("tighter"); if (over()) app.classList.add("tightest"); } }
  app.classList.remove("measuring");
}

/* Seiten ohne Flackern aktualisieren: nur geänderte Teile anfassen statt alles neu aufzubauen */
function morph(a, b){
  if (a.nodeType !== b.nodeType || a.nodeName !== b.nodeName){ a.replaceWith(b); return; }
  if (a.nodeType === 3 || a.nodeType === 8){ if (a.nodeValue !== b.nodeValue) a.nodeValue = b.nodeValue; return; }
  if (a.nodeType !== 1) return;
  for (const at of [...a.attributes]) if (!b.hasAttribute(at.name) && !(a.tagName === "DETAILS" && at.name === "open")) a.removeAttribute(at.name);
  for (const at of [...b.attributes]) if (a.getAttribute(at.name) !== at.value) a.setAttribute(at.name, at.value);
  if (a.tagName === "INPUT" && a !== document.activeElement){ const v = b.getAttribute("value") || ""; if (a.value !== v) a.value = v; }
  morphKids(a, b);
}
function morphKids(a, b){
  const ac = [...a.childNodes], bc = [...b.childNodes];
  for (let i = 0; i < bc.length; i++){ if (i < ac.length) morph(ac[i], bc[i]); else a.appendChild(bc[i]); }
  for (let i = ac.length - 1; i >= bc.length; i--) ac[i].remove();
}
function paint(html){

  if (app.dataset.pk === key){ const t = document.createElement("div"); t.innerHTML = html; morphKids(app, t); }

}

/* =====================================================================
   Speicher: Fotos und Rückblicke in IndexedDB (viel Platz), sonst localStorage
   ===================================================================== */
const DB = { db:null };
DB.ready = new Promise(res => {
  try {
    if (!window.indexedDB) return res(false);
    const rq = indexedDB.open("sixcup", 1);
    rq.onupgradeneeded = () => { const d = rq.result; ["photos","games"].forEach(n => { if (!d.objectStoreNames.contains(n)) d.createObjectStore(n); }); };
    rq.onsuccess = () => { DB.db = rq.result; res(true); };
    rq.onerror = () => res(false); rq.onblocked = () => res(false);
    setTimeout(() => res(false), 4000);
  } catch(e){ res(false); }
});
function idbReq(store, mode, fn){
  return DB.ready.then(ok => new Promise(res => {
    if (!ok || !DB.db) return res({ ok:false });
    try {
      const tx = DB.db.transaction(store, mode); const r = fn(tx.objectStore(store));
      tx.oncomplete = () => res({ ok:true, v: r ? r.result : undefined });
      tx.onerror = tx.onabort = () => res({ ok:false });
    } catch(e){ res({ ok:false }); }
  }));
}
const idbGet = (st, k) => idbReq(st, "readonly", o => o.get(k)).then(r => r.ok ? r.v : undefined);
const idbPut = (st, k, v) => idbReq(st, "readwrite", o => o.put(v, k)).then(r => r.ok);
const idbDel = (st, k) => idbReq(st, "readwrite", o => o.delete(k)).then(r => r.ok);
const idbAll = st => idbReq(st, "readonly", o => o.getAll()).then(r => r.ok ? (r.v || []) : null);

/* Alte Fotos aus dem kleinen Speicher (localStorage) einmalig umziehen */
async function migratePhotos(){
  if (!(await DB.ready)) return;
  let keys = []; try { for (let i = 0; i < localStorage.length; i++){ const k = localStorage.key(i); if (k && k.startsWith("tw_ph_")) keys.push(k); } } catch(e){ return; }
  for (const k of keys){ const d = LS.get(k); if (!d) continue; if (await idbPut("photos", k.slice(6), d)) LS.del(k); }
}

let recaps = [];   // neueste zuerst
let recapsLoaded = false;
async function loadRecaps(){
  let all = await idbAll("games");
  if (all === null){ try { all = JSON.parse(LS.get("tw_recaps") || "[]"); } catch(e){ all = []; } }
  recaps = all.filter(r => r && r.id && Array.isArray(r.players)).sort((a, b) => b.t - a.t);
  recapsLoaded = true;
}
function persistRecaps(r){
  return idbPut("games", r.id, r).then(ok => { if (!ok) LS.set("tw_recaps", JSON.stringify(recaps.slice(0, 40).map(x => Object.assign({}, x)))); });
}
let persistAsked = false;
function saveRecap(){
  if (!state.gameId || state.players.length < 1 || !state.rollId) return;
  const r = { id:state.gameId, t:Date.now(), started:state.started || Date.now(),
    settings:{ order:state.settings.order, ko:state.settings.ko, hearts:state.settings.hearts, cards:state.settings.cards },
    players:JSON.parse(JSON.stringify(state.players)), winners:state.winners ? state.winners.slice() : null,
    rage:state.rage ? Object.assign({}, state.rage) : null, proofs:JSON.parse(JSON.stringify(state.proofs)), rolls:state.rollId };
  const i = recaps.findIndex(x => x.id === r.id);
  if (i >= 0){ r.started = recaps[i].started; if (JSON.stringify(Object.assign({}, recaps[i], { t:0 })) === JSON.stringify(Object.assign({}, r, { t:0 }))) return; recaps[i] = r; }
  else recaps.unshift(r);
  recaps.sort((a, b) => b.t - a.t);
  persistRecaps(r);
  if (!persistAsked){ persistAsked = true; try { navigator.storage && navigator.storage.persist && navigator.storage.persist().catch(() => {}); } catch(e){} }
}

function photoRefs(withState){

  recaps.forEach(add); if (withState) add(state);
  return set;
}
function dropUnused(ids, withState){ const keep = photoRefs(withState); ids.forEach(id => { if (id && !keep.has(id)) dropPhoto(id); }); }
async function deleteRecap(id){
  const r = recaps.find(x => x.id === id); if (!r) return;
  recaps = recaps.filter(x => x.id !== id);
  await idbDel("games", id); if (!DB.db) LS.set("tw_recaps", JSON.stringify(recaps));
  const ids = []; r.players.forEach(p => ids.push(p.photo)); r.proofs.forEach(x => { ids.push(x.photo); (x.frames || []).forEach(f => ids.push(f)); });
  dropUnused(ids, true);
}
const recapIds = r => { const ids = []; r.players.forEach(p => p.photo && ids.push(p.photo)); r.proofs.forEach(x => { ids.push(x.photo); (x.frames || []).forEach(f => ids.push(f)); }); return ids; };
async function storageMB(){ try { const e = await navigator.storage.estimate(); return Math.round((e.usage || 0) / 1048576); } catch(e){ return null; } }
const STORAGE_LIMIT = 300;
let storageUse = null;
async function freeOldPhotos(){
  // Fotos der ältesten Spiele löschen (Ergebnisse bleiben), bis wieder Platz ist
  const old = recaps.slice().reverse().filter(r => !r.noPhotos && recapIds(r).length);
  for (const r of old.slice(0, Math.max(1, Math.ceil(old.length / 3)))){
    const ids = recapIds(r); r.noPhotos = true; r.proofs = []; r.players.forEach(p => { p.photo = null; });
    await persistRecaps(r); dropUnused(ids, true);
  }
  storageUse = await storageMB();
}

    return "";

  const tipWho = s && s.t === "drink" ? P(s.who) : null;
  const camTip = tipWho && !camTipSeen(tipWho.id) ? tipWho : null;
  const cardBtn = S.cards && !p.cardUsed ? `<button class="mini card-btn" data-act="card">${ICON.card} Karte spielen</button>` : "";
  const konterBtn = S.cards && active().some(q => !q.cardUsed) ? `<button class="mini" data-act="konter">${ICON.shield} Konter?</button>` : "";
  const camBtn = `<button class="mini cam-btn${camTip ? " glow" : ""}" data-act="proof" aria-label="Beweisfoto">${ICON.cam} Foto${(() => { const n = s && s.key ? state.proofs.filter(x => x.key === s.key).length : 0; return n ? " " + n : ""; })()}</button>`;
  let showDie = true, verdict = "", actions = "", extra = "";

  if (!s){

    actions = `<button class="btn" data-act="roll">Würfeln</button>${cardBtn ? `<div class="minis">${cardBtn}</div>` : ""}`;
  } else if (s.t === "fill"){
    const g = state.glasses[s.glass];
    const more = state.steps.length > 1;
    verdict = `<span class="word">Auffüllen</span><span class="line">Becher ${s.glass + 1} ist leer${g.content ? " · " + esc(g.content) + " rein" : ""}</span>`;
    actions = `<button class="btn" data-act="confirm">Aufgefüllt${more ? "" : ` <span class="sub">· ${passLabel()}</span>`}</button>${cardBtn ? `<div class="minis">${cardBtn}</div>` : ""}`;
  } else if (s.t === "drink"){
    const d = P(s.who); const g = s.kurz ? null : state.glasses[s.glass];
    const fromP = s.from && P(s.from);
    const reason = s.via ? VIA[s.via] + (fromP ? " von " + esc(fromP.name) : "") : "";
    const what = s.kurz ? "einen Extra-Schluck" : `Becher ${s.glass + 1}${g.type === "shot" ? " · den goldenen" : ""}${g.content ? " · " + esc(g.content) : ""}`;
    const own = d && d.id === p.id;
    showDie = !!s.main && !camTip;
    const kd = s.kurz && s.n && (s.via === "doppel" || s.via === "drilling") ? kurzWhy(s, d) : "";
    verdict = `<span class="word${s.kurz ? " long" : ""}">${s.kurz ? "Extra-Schluck!" : "Trinken!"}</span>
      ${kd ? (own ? kd : `<span class="whobar">${avatar(d,"s")}${esc(d ? d.name : "?")}</span>${kd}`) : own ? `<span class="line">${what}${reason ? " · " + reason : ""}</span>` : `<span class="whobar">${avatar(d,"s")}${esc(d ? d.name : "?")}</span><span class="line">trinkt ${what}${reason ? " · " + reason : ""}</span>`}
      ${s.main && own && p.streak >= 1 && !s.from ? `<span class="streak">${p.streak + 1}. am Stück</span>` : ""}
      ${camTip ? `<div class="camtip" role="note"><div><b>${esc(camTip.name)}, Beweisfoto?</b> Tipp unten auf <b>Foto</b> für einen kurzen Boomerang.<span class="more"> Alle Fotos gibt's am Ende.</span></div><button class="tipok" data-act="camtip-ok" data-id="${camTip.id}">Verstanden</button></div>` : ""}`;
    const label = state.steps.length === 1 && s.main && state.after === "again" && d && d.id === p.id ? `Getrunken <span class="sub">· nochmal würfeln</span>` : "Getrunken";
    actions = `<button class="btn" data-act="confirm">${label}</button>
      <div class="minis">${konterBtn}${canJoker() ? `<button class="mini" data-act="joker">${ICON.swap} Joker</button>` : ""}${camBtn}</div>`;
  } else if (s.t === "allDrink"){
    showDie = false;
    verdict = `<span class="word">Alle trinken!</span><span class="line">Volles Haus · jeder einen Extra-Schluck</span>
      <div class="allrow">${active().map(q => `<span class="x ${s.excused.includes(q.id) ? "saved" : ""}">${avatar(q,"s")}</span>`).join("")}</div>`;
    actions = `<button class="btn" data-act="confirm">Alle haben getrunken</button><div class="minis">${konterBtn}${camBtn}</div>`;
  } else if (s.t === "pick"){
    showDie = false;
    const by = P(s.by);
    const T = { duell:["Gold-Duell!","wer trinkt einen Extra-Schluck mit?"], rache:["Rache!","wer trinkt den nächsten vollen Becher?"], joker:["Joker!","wer bekommt deinen Becher?"],
      umleitung:["Umleitung!","wer trinkt den nächsten vollen Becher?"], barkeeper:["Gastgeber!","wer trinkt sofort einen Extra-Schluck?"], engel:["Schutzengel!","wen rettest du?"],
      sabotage:["Sabotage!","tippe einen leeren Becher an."], tausch:["Tausch!", s.first == null ? "tippe den ersten Becher an." : "jetzt den zweiten Becher."] }[s.purpose];
    verdict = `<span class="word">${T[0]}</span><span class="line">${esc(by ? by.name : "")}, ${T[1]}</span>`;
    if (!glassPick) extra = `<div class="picks">${pickTargets(s).map(q => `<button class="pk" data-act="pick" data-id="${q.id}">${avatar(q,"m")}<span>${esc(q.name)}</span></button>`).join("")}</div>`;
  } else if (s.t === "pass"){
    verdict = `<span class="word">Fertig</span><span class="line">Karte gespielt. Jetzt geht's weiter.</span>`;
    actions = `<button class="btn" data-act="confirm">${passLabel().replace(/^./, c => c.toUpperCase())}</button>`;
  } else if (s.t === "ko"){

    verdict = `<span class="whobar koed ko-av">${avatar(d,"l")}<span class="stamp big"><span>K.O.</span></span></span>
      <span class="word ko-name">${esc(d ? d.name : "")}</span>
      <span class="line">${s.voluntary ? "steigt aus" : "hat keine Herzen mehr"} und ist raus.</span>`;
    actions = `<button class="btn" data-act="confirm">Weiter</button>`;
  }

  // Kommt nach diesem Schritt noch ein Extra-Schluck wegen Doppel/Drilling? Dann gleich ankündigen.
  const nextK = s && s.main ? state.steps.slice(1).find(x => x.t === "drink" && x.kurz && (x.via === "doppel" || x.via === "drilling")) : null;
  if (nextK) verdict += `<span class="after-k">Danach: Extra-Schluck wegen ${VIA[nextK.via]}</span>`;
  const rd = state.redirect && P(state.redirect.target);
  app.innerHTML = `
  <div class="top">

    <button class="pl ${i === state.turn ? "cur" : ""} ${q.ko ? "koed" : (q.active ? "" : "out")}" data-act="player" data-id="${q.id}" aria-label="${esc(q.name)}, ${tot(q)} Becher">

  }

/* ---- Endstand ---- */
function awards(g = state){
  const ps = g.players; if (!ps.length) return [];
  const by = f => ps.slice().sort((a,b) => f(b) - f(a))[0];
  const out = [];
  const top = by(p => tot(p) * 10 + p.shots);
  if (tot(top)) out.push(["Meiste Becher", top, tot(top)]);
  const sh = by(p => p.shots); if (sh.shots) out.push(["Goldjäger", sh, sh.shots + "× Gold"]);
  const st = by(p => p.best); if (st.best > 1) out.push(["Längste Serie", st, st.best + "×"]);
  const dr = by(p => p.drillings); if (dr.drillings) out.push(["Drilling-König", dr, dr.drillings + "×"]);
  const ko = ps.find(p => p.konters > 0); if (ko) out.push(["Bester Konter", ko, CARDS[ko.card] ? CARDS[ko.card].name : "Konter"]);
  const low = ps.slice().sort((a,b) => tot(a) - tot(b))[0];
  if (ps.length > 1 && tot(top) && low !== top) out.push(["Wenigste Becher", low, tot(low)]);
  return out.slice(0, 6);
}
function nearLines(g = state){
  const out = [];
  const a = g.players.slice().sort((x,y) => y.nearLast - x.nearLast)[0];
  if (a && a.nearLast) out.push(`${esc(a.name)} hat ${a.nearLast}× genau den einzigen vollen Becher auf dem Tisch erwischt.`);
  const b = g.players.slice().sort((x,y) => y.nearRefill - x.nearRefill)[0];
  if (b && b.nearRefill) out.push(`${esc(b.name)} hat ${b.nearRefill}× genau den Becher getroffen, den die Person davor gerade gefüllt hatte.`);
  return out;
}
/* Rangliste: normal nach geleerten Bechern (Gold zählt doppelt), im K.O.-Modus nach Durchhalten */
const rankTitle = (g = state) => g.settings.ko ? "Wer hat am längsten durchgehalten" : "Wer hat die meisten Becher geleert";
function rankKey(p){ return p.ko ? -1e6 + (p.koAt || 0) : 1e6 + (p.hearts || 0); }
function ranking(g = state){
  const byDrinks = (a, b) => (tot(b) - tot(a)) || (b.shots - a.shots);
  const ps = g.players.slice();
  if (!g.settings.ko) return ps.sort(byDrinks);
  const W = g.winners || [];
  return ps.sort((a, b) => (W.includes(b.id) - W.includes(a.id)) || (rankKey(b) - rankKey(a)) || (tot(a) - tot(b)));
}
function rankNums(list, g = state){
  // Gleichzeitig K.O. = gleicher Platz
  return list.map((p, i) => { if (!g.settings.ko || !p.ko) return i + 1; const j = list.findIndex(q => q.ko && q.koAt === p.koAt); return j + 1; });
}
const rankVal = (p, g = state) => g.settings.ko ? (p.ko ? "K.O." : (p.hearts || 0) + " ♥") : String(tot(p));
function rankRows(g = state){
  const sorted = ranking(g), nums = rankNums(sorted, g);
  return `<div class="rows">${sorted.map((p,i) => `
    <div class="r"><span class="rk">${nums[i]}</span>${avatar(p,"s")}
      <span class="nm">${esc(p.name)}<small>${p.drinks} Becher · ${p.extras} Extra · ${p.shots} Gold${g.settings.ko ? "" : (p.active ? "" : " · ausgestiegen")}</small></span>
      <span class="val${g.settings.ko && p.ko ? " out" : ""}">${rankVal(p, g)}</span></div>`).join("")}</div>`;
}

/* ---- Effekte (Overlays) ---- */
let fxBusy = false;
function pumpFx(){
  if (state.spin){ fxQ.push({ type:"spin", id:state.spin.id, slow:state.spin.slow }); state.spin = null; save(); }
  if (state.phase === "end" && state.recapPending){ fxQ.push({ type:"recap" }); state.recapPending = false; save(); }
  if (fxBusy || !fxQ.length || headless) return;
  const f = fxQ.shift();
  if (f.type === "rule"){
    fxShell(`<span class="crown" style="color:var(--drink);font-family:var(--display);font-weight:800;letter-spacing:.2em;font-size:14px;text-transform:uppercase">Hausregel</span><div class="big" style="font-size:clamp(38px,11vw,64px)">${esc(f.text)}</div><div class="sub">${esc(f.label)}</div>`, 2600);
    sfx("rule"); buzz([40,40,40]); return;
  }
  showFx(f);
}
function fxDone(){ fxRoot.innerHTML = ""; fxBusy = false; clearTimeout(fxDone._t); (fxDone._iv || []).forEach(clearInterval); fxDone._iv = []; pumpFx(); }
function fxShell(html, ms, cls){
  fxBusy = true;
  fxRoot.innerHTML = `<div class="fx ${cls || ""}" data-act="fx-skip">${html}<span class="skip">Tippen zum Überspringen</span></div>`;

}
function syncRuleForm(){
  const f = document.getElementById("rule-form"); if (!f) return;
  const trig = f.dataset.trig, n = f.dataset.n;
  f.querySelectorAll("[data-act=rule-trig]").forEach(b => b.setAttribute("aria-pressed", b.dataset.k === trig));
  const nums = document.getElementById("rule-nums"); nums.hidden = trig !== "num";
  nums.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", b.dataset.k === String(n)));
}

let tourSeen = false, tourI = 0;
const TOUR = [
  { t:"So geht's", d:"Leerer Becher gewürfelt: auffüllen und das Handy weitergeben. Voller Becher: austrinken und sofort nochmal würfeln. Was in die Becher kommt, entscheidet ihr.", v:"glasses" },
  { t:"Das Handy wandert", d:"Jeder trägt sich ein, macht ein Selfie und würfelt direkt los. Ist das Handy wieder beim Ersten: „Alle sind drin“ tippen.", v:"pass" },
  { t:"Karten und Konter", d:"Viele bekommen eine geheime Karte: gedrückt halten zum Ansehen. Im eigenen Zug „Karte spielen“. Muss jemand trinken: „Konter?“ und aufs eigene Bild tippen.", v:"card" },
  { t:"Beweisfotos", d:"Muss jemand trinken, tippt unten auf „Foto“: Das Handy nimmt einen kurzen Boomerang auf. Am Ende seht ihr alle Fotos und könnt sie runterladen.", v:"photo" },
  { t:"Extras", d:"Add-ons, K.O.-Modus und Hausregeln stellst du vor dem Start ein. Wer nicht mehr mag, tippt unten auf sich und steigt aus. Wasser zwischendurch hilft.", v:"extras" }
];
function openTour(){ tourI = 0; renderTour(); }
function closeTour(){ const r = document.getElementById("tour-root"); if (r) r.innerHTML = ""; LS.set("tw_tour", "1"); }
function renderTour(){
  let root = document.getElementById("tour-root");
  if (!root){ root = document.createElement("div"); root.id = "tour-root"; document.body.appendChild(root); }
  const s = TOUR[tourI], last = tourI === TOUR.length - 1;
  const vis = {
    glasses: `<div class="tour-glasses">${[0,1,2].map(i => glassHTML(i, "", true)).join("")}</div>`,
    pass: `<div class="tour-pass">${["L","H","J"].map((x, i) => `<span class="av av-m" style="--c:${PALETTE[i]}">${x}</span>`).join('<span class="arr">→</span>')}</div>`,
    card: `<div class="tour-cards"><div class="mc back">?</div><span class="arr">→</span><div class="mc front"><span class="tag attack">Angriff</span><b>Sabotage</b></div></div>`,
    photo: `<div class="tour-photo"><span class="fb">${ICON.cam} Foto</span><span class="arr" style="font-family:var(--display);font-weight:800;font-size:28px;opacity:.85">→</span><span class="ph">${ICON.cam}<span class="boomtag">BOOMERANG</span></span></div>`,
    extras: `<div class="tour-chips"><span>K.O.-Modus</span><span>Volles Haus</span><span>Joker</span><span>Hausregeln</span></div>`
  }[s.v];
  root.innerHTML = `<div class="tour" role="dialog" aria-label="Einführung"><div class="tour-card" id="tour-card">
    <div class="tour-top"><span class="eyebrow">Einführung · ${tourI + 1}/${TOUR.length}</span><button class="tour-skip" data-tour="skip">Überspringen</button></div>
    <div class="tour-vis">${vis}</div>
    <h2>${s.t}</h2><p>${s.d}</p>
    <div class="row">${tourI > 0 ? `<button class="btn alt" data-tour="prev">Zurück</button>` : ""}<button class="btn" data-tour="next">${last ? "Los geht's" : "Weiter"}</button></div>
  </div></div>`;
  const card = document.getElementById("tour-card"); let x0 = null;
  card.addEventListener("pointerdown", e => { x0 = e.clientX; });
  card.addEventListener("pointerup", e => { if (x0 == null) return; const dx = e.clientX - x0; x0 = null; if (dx < -50 && tourI < TOUR.length - 1){ tourI++; renderTour(); } else if (dx > 50 && tourI > 0){ tourI--; renderTour(); } });
}
document.addEventListener("click", e => {
  const b = e.target.closest("[data-tour]"); if (!b) return;
  const a = b.dataset.tour;
  if (a === "skip") closeTour();
  else if (a === "prev"){ tourI = Math.max(0, tourI - 1); renderTour(); }
  else if (a === "next"){ if (tourI >= TOUR.length - 1) closeTour(); else { tourI++; renderTour(); } }
});

function sWrap(x, text, maxW){
  const words = String(text).split(/\s+/); const lines = []; let line = "";
  words.forEach(w => { const tst = line ? line + " " + w : w; if (x.measureText(tst).width > maxW && line){ lines.push(line); line = w; } else line = tst; });
  if (line) lines.push(line); return lines;
}

  x.beginPath(); x.arc(cx, cy, r, 0, Math.PI * 2); x.closePath(); x.fillStyle = colorOf(p); x.fill(); x.clip();
  const ph = faces && p && p.photo && photos[p.photo];
  if (ph){ try { const im = await loadImg(ph); const s = Math.min(im.naturalWidth, im.naturalHeight); x.drawImage(im, (im.naturalWidth - s) / 2, (im.naturalHeight - s) / 2, s, s, cx - r, cy - r, r * 2, r * 2); } catch(e){} }
  else { x.fillStyle = "#ffffff"; x.font = `800 ${Math.round(r * 1.05)}px ${SH_DISP}`; x.textAlign = "center"; x.textBaseline = "middle"; x.fillText(((p && p.name) || "?").trim().charAt(0).toUpperCase(), cx, cy + r * 0.04); }

}
