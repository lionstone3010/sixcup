<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta id="vp" name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#f2f3f5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Test oben">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<title>Test oben</title>
<script>
/* Variante aus der Adresse lesen, bevor die Seite gezeichnet wird */
var q = new URLSearchParams(location.search);
var V = (q.get("v") || "0").toUpperCase();
var C = q.get("c") === "blau";
document.documentElement.className = "v" + V + (C ? " blau" : "");
if (V === "E") document.getElementById("vp").content = "width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no";
if (C) document.querySelector('meta[name="theme-color"]').content = "#2b50e8";
</script>
<style>
:root{--bg:#f2f3f5;--fg:#14151b;--soft:#5b5f6e;--sa:env(safe-area-inset-top,0px);--tx:calc(var(--sa) * 0.45)}
html.blau{--bg:#2b50e8;--fg:#fff;--soft:rgba(255,255,255,.8)}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--fg);font:16px/1.4 -apple-system,system-ui,sans-serif;-webkit-text-size-adjust:100%}
.wrap{padding:calc(var(--sa) + var(--tx)) 20px calc(env(safe-area-inset-bottom,0px) + 20px)}
/* Testinhalt direkt unter der Statusleiste, wie in der App */
.probe{display:flex;align-items:center;gap:12px}
.probe .ring{width:52px;height:52px;border-radius:50%;border:3px solid var(--fg);display:grid;place-items:center;font-weight:800;font-size:22px}
.probe small{display:block;letter-spacing:.18em;font-weight:800;font-size:12px;color:var(--soft)}
.probe b{font-size:30px;line-height:1.1}
.lines{margin-top:10px;font-size:13px;color:var(--soft)}
.card{margin-top:22px;background:rgba(127,127,127,.12);border-radius:18px;padding:16px}
.card h1{margin:0 0 4px;font-size:26px}
.card p{margin:6px 0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.grid a{display:block;text-decoration:none;text-align:center;padding:14px 8px;border-radius:14px;background:#fff;color:#14151b;font-weight:800;border:2px solid transparent}
.grid a.on{border-color:#e23d28}
.grid a span{display:block;font-weight:500;font-size:12px;color:#5b5f6e}
.farbe{display:block;margin-top:12px;text-align:center;color:var(--fg);font-weight:700}
.filler{height:40vh}

/* Varianten */
.band{display:none;position:fixed;top:0;left:0;right:0;height:var(--sa);background:var(--bg);z-index:10}
.vA .band,.vC .band,.vF .band{display:block}
.vB .band{display:block;height:calc(var(--sa) + var(--tx) - 4px)}
.vC .band{pointer-events:none}
.head{display:none}
.vD .wrap{padding-top:0}
.vD .head{display:block;position:sticky;top:0;height:calc(var(--sa) + var(--tx) - 4px);margin:0 -20px 4px;background:var(--bg);z-index:10}
/* F: Seite selbst scrollt nicht, Inhalt liegt in einem festen Kasten */
html.vF,html.vF body{overflow:hidden;height:100%}
.vF .wrap{position:fixed;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch}
</style>
</head>
<body>
<div class="band"></div>
<div class="wrap">
  <div class="head"></div>
  <div class="probe">
    <div class="ring">K</div>
    <div><small>IST DRAN</small><b>Klki Testname</b></div>
  </div>
  <div class="lines">Feine Schrift zum Vergleichen: ABCDEFGHIJ abcdefghij 0123456789</div>

  <div class="card">
    <h1 id="t">Variante 0</h1>
    <p id="d"></p>
    <p><b>So testest du:</b> Tippe nacheinander jede Variante an und schau, ob oben „IST DRAN“, der Kreis und die feine Schrift scharf sind. Schreib mir die Buchstaben, bei denen alles scharf ist.</p>
    <div class="grid" id="g"></div>
    <a class="farbe" id="f" href="#"></a>
  </div>
  <div class="filler"></div>
</div>
<script>
var info = {
  "0": ["Ohne alles", "Vergleich: so wie früher"],
  "A": ["Streifen, antippbar", "Fester Streifen über der Statusleiste"],
  "B": ["Streifen, tiefer", "Wie A, reicht bis kurz über den Inhalt"],
  "C": ["Streifen wie 4.2.2", "So ist es gerade in der App"],
  "D": ["Mitlaufende Kopfleiste", "Kopfleiste, die beim Scrollen oben klebt"],
  "E": ["Nicht im Vollbild", "Seite beginnt erst unter der Statusleiste"],
  "F": ["Fester Kasten", "Seite scrollt nicht, dazu Streifen wie A"]
};
var cur = info[V] ? V : "0";
document.getElementById("t").textContent = "Variante " + cur + ": " + info[cur][0];
document.getElementById("d").textContent = info[cur][1];
var g = document.getElementById("g");
Object.keys(info).forEach(function(k){
  var a = document.createElement("a");
  a.href = "?v=" + k + (C ? "&c=blau" : "");
  a.className = k === cur ? "on" : "";
  a.innerHTML = k + "<span></span>"; a.querySelector("span").textContent = info[k][0];
  g.appendChild(a);
});
var f = document.getElementById("f");
f.textContent = C ? "Mit grauem Hintergrund testen" : "Mit blauem Hintergrund testen";
f.href = "?v=" + cur + (C ? "" : "&c=blau");
</script>
</body>
</html>
